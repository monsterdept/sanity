name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# CI is read-only. It runs tests + lints — never pushes commits, releases,
# or artifacts. Mirrors release.yml's permissions block but scoped to read.
permissions:
  contents: read

# Incremental compilation is for editing one crate over and over; CI builds
# once from a cold or cached tree, and the incremental files only bloat the
# cache `rust-cache` saves.
env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          # GitHub-hosted, never self-hosted: this repo is public, and a pull
          # request from a fork runs this workflow with the contributor's code.
          # On a hosted runner that is a throwaway VM; on a machine of ours it
          # would be their code on our hardware.
          #
          # The arm64 builds are release-only. Testing on the three platforms
          # people develop on is what this job is for; the release proves the
          # other two build.
          - os: macos-15
            platform: macos_arm64
          - os: ubuntu-22.04
            platform: linux_x86-64
          - os: windows-latest
            platform: windows_x86-64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      # Linux is the only platform that needs OS-level tauri deps as a
      # workflow step — Windows uses WebView2 (preinstalled), macOS uses
      # WebKit.framework (part of the OS).
      - name: install tauri system deps (linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libxdo-dev

      # msvc-dev-cmd exports the vcvarsall environment (cl, link, lib) into the
      # steps after it — the tree-sitter grammars are C, so this is load-bearing
      # here, not just for the Rust link step.
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'

      # Git for Windows ships a coreutils `link` in /usr/bin, and under `shell: bash` it sits
      # ahead of MSVC's link.exe on PATH — so rustc links with it and gets `extra operand`.
      # The runner is thrown away after the job, so removing it costs nothing.
      - name: Keep Git's link out of the linker's way (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: rm -f /usr/bin/link.exe

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      # Dependencies only: `src-tauri` itself rebuilds every run, and the cache
      # is what keeps a hosted runner from compiling ~500 crates from scratch.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install frontend dependencies
        shell: bash
        working-directory: web
        run: npm ci

      # tauri-build reads frontendDist (../web/dist) while compiling the
      # src-tauri crate; without a prior frontend build it errors on the
      # missing directory. Always build the frontend before any cargo step.
      - name: Build frontend
        shell: bash
        working-directory: web
        run: npm run build

      # The frontend's one test: a synthetic timeline folded to the same commit two ways,
      # comparing a backward seek against a fold from the opening state. Deterministic and
      # needs no repo checked out. See `just web-check replay`.
      - name: Replay equality check
        shell: bash
        working-directory: web
        run: |
          set -euo pipefail
          ./node_modules/.bin/esbuild scripts/replay-check.ts --bundle --format=esm \
            --platform=node --outfile="$RUNNER_TEMP/replay-check.mjs" --log-level=warning
          node "$RUNNER_TEMP/replay-check.mjs"

      # The Rust workspace lives in src-tauri/: the app crate, and `tools` for the dev tools
      # that must not ship in the bundle. `--workspace` so a tool that stops compiling fails
      # here. Scanning and scoring run in-process, not as a sidecar.
      - name: cargo test
        shell: bash
        working-directory: src-tauri
        run: cargo test --workspace

      - name: cargo clippy -- -D warnings
        shell: bash
        working-directory: src-tauri
        run: cargo clippy --workspace --all-targets -- -D warnings

      # The headless build — every verb, no window — so one that stops compiling fails here
      # rather than in a release. See docs/plans/done/headless-cli.md.
      - name: cargo clippy --no-default-features -- -D warnings
        shell: bash
        working-directory: src-tauri
        run: cargo clippy --no-default-features --all-targets -- -D warnings

  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install frontend dependencies
        shell: bash
        working-directory: web
        run: npm ci

      # `tsc -b` (project-references build mode), NOT `tsc --noEmit`: the root
      # tsconfig.json is a solution file (`files: []` + references), so
      # `--noEmit` checks zero files and passes vacuously. `-b` builds the
      # referenced app/node projects and actually type-checks — matching what
      # `npm run build` (`tsc -b && vite build`) enforces.
      - name: TypeScript type-check
        shell: bash
        working-directory: web
        run: npx tsc -b
