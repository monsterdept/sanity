name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# CI is read-only. It runs tests + lints — never pushes commits, releases,
# or artifacts. Mirrors release.yml's permissions block but scoped to read.
permissions:
  contents: read

# Incremental compilation produces a lot of small files under
# target/debug/incremental/ that bloat the persistent target dir without
# much benefit (incremental helps own-crate edits, but CI's bulk-build cost
# is in dep crates which don't use it).
env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          # krapow base images ship a GitHub-hosted-equivalent universal
          # toolchain (C compiler on Linux; MSVC + chocolatey + LLVM on
          # Windows; Xcode CLI tools + WebKit on macOS). The workflow installs
          # only language toolchains + project-specific deps on top, the same
          # way it would on ubuntu-latest / windows-latest / macos-latest.
          #
          # Windows ARM64 is release-only: it is cross-compiled from the x64
          # runner, so there is no machine here that can execute its tests.
          # `cargo check --target` in CI would only re-prove what the release
          # build proves, at the cost of a second full dep compile.
          - os: [self-hosted, macOS, arm64, krapow]
            platform: macos_arm64
          - os: [self-hosted, linux, X64, krapow]
            platform: linux_x86-64
          - os: [self-hosted, windows, X64, krapow]
            platform: windows_x86-64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      # Linux is the only platform that needs OS-level tauri deps as a
      # workflow step — Windows uses WebView2 (preinstalled), macOS uses
      # WebKit.framework (part of the OS).
      - name: install tauri system deps (linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libxdo-dev

      # krapow Windows base ships MSVC 2022 Build Tools. msvc-dev-cmd just
      # exports vcvarsall env (cl, link, lib) into subsequent steps — the
      # tree-sitter grammars are C, so this is load-bearing here, not just
      # for the Rust link step.
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install frontend dependencies
        shell: bash
        working-directory: web
        run: npm ci

      # tauri-build reads frontendDist (../web/dist) while compiling the
      # src-tauri crate; without a prior frontend build it errors on the
      # missing directory. Always build the frontend before any cargo step.
      - name: Build frontend
        shell: bash
        working-directory: web
        run: npm run build

      # The whole Rust crate lives in src-tauri/ — there is no workspace-root
      # backend crate. Scanning and scoring run in-process, not as a sidecar.
      - name: cargo test
        shell: bash
        working-directory: src-tauri
        run: cargo test

      - name: cargo clippy -- -D warnings
        shell: bash
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      # Persistent self-hosted runners never evict target/ between runs, so
      # sibling projects' debug + release builds pile up until the disk fills.
      # Reclaim after every run. always() so a failed/cancelled run still
      # cleans up; || true so a missing target dir is a no-op.
      - name: Clean target dirs
        if: always()
        shell: bash
        run: cargo clean --manifest-path src-tauri/Cargo.toml || true

  lint:
    runs-on: [self-hosted, linux, X64, krapow]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install frontend dependencies
        shell: bash
        working-directory: web
        run: npm ci

      # `tsc -b` (project-references build mode), NOT `tsc --noEmit`: the root
      # tsconfig.json is a solution file (`files: []` + references), so
      # `--noEmit` checks zero files and passes vacuously. `-b` builds the
      # referenced app/node projects and actually type-checks — matching what
      # `npm run build` (`tsc -b && vite build`) enforces.
      - name: TypeScript type-check
        shell: bash
        working-directory: web
        run: npx tsc -b
