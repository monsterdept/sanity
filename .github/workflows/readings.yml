name: Readings

# The release gate: the committed .sanity/ must be complete, current to the code, and
# taken by one agent and model. Called by release.yml before anything is built, and
# runnable by hand to see where a release would stand without tagging one.
#
# It takes no readings — that would mean model credentials here. Readings are taken
# with `sanity check` and committed; this only rules on what was committed.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The AppImage loads the window's graphics libraries even for a verb with no window, and a
      # clean hosted runner has none of them: without these it fails with `libEGL.so.1: cannot
      # open shared object file`, which sanity-action@v1 reports as the release having no
      # `verify`. Gone when this gate runs the headless build through sanity-action@v2.
      - name: Install the libraries the AppImage loads
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libegl1 libgl1 libgbm1
      # The release that judges staleness. It cannot be the one being tagged, which has
      # no published build until this gate has passed; move it when `just expiry` says a
      # release changes what a reading is taken against.
      - uses: monsterdept/sanity-action@v1
        with:
          version: 0.31.1
