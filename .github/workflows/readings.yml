name: Readings

# The release gate: the committed .sanity/ must be complete, current to the code, and
# taken by one agent and model. Called by release.yml before anything is built, and
# runnable by hand to see where a release would stand without tagging one.
#
# It takes no readings — that would mean model credentials here. Readings are taken
# with `sanity check` and committed; this only rules on what was committed.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The release that judges staleness. It cannot be the one being tagged, which has
      # no published build until this gate has passed; move it when `just expiry` says a
      # release changes what a reading is taken against.
      # v2 runs the headless `sanity` from the release on GitHub: no window, so none of the
      # graphics libraries the v1 AppImage needed on a hosted runner.
      - uses: monsterdept/sanity-action@v2
        with:
          version: 0.33.0
