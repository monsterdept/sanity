name: Release

on:
  push:
    tags:
      - "v*"

# All three jobs need write access to releases — `draft` creates the draft,
# every build job pushes its bundles straight into it (bypassing
# upload-artifact's chunked Azure Blob path, which has historically stalled on
# Mac runners, and keeping bundles off the Actions artifact-storage quota), and
# the release job promotes the draft to published.
permissions:
  contents: write

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always

jobs:
  # THE DRAFT IS MADE ONCE, HERE, BEFORE ANY BUILD CAN RACE TO MAKE ONE.
  #
  # It used to be made by whichever build job uploaded first: four jobs each
  # pointed `softprops/action-gh-release` at the tag, and the action creates a
  # release when it cannot find one. Two of them landing in the same second
  # each created their own draft, each then found the other's and deleted its
  # own as the duplicate, and both uploads failed on top of that — v0.30.1
  # shipped a draft holding the DMG, the AppImage, the rpm and the deb and
  # neither Windows installer, because macOS and Linux happened to finish
  # minutes apart and the two Windows builds did not.
  #
  # A release that already exists is not created twice. The builds below find
  # this one and upload into it, which is the only thing they ever needed to do.
  # A release ships with its readings, so a tag whose .sanity/ is missing, expired or
  # mixed stops here — before the draft exists and before four platforms build.
  readings:
    uses: ./.github/workflows/readings.yml

  draft:
    needs: readings
    runs-on: ubuntu-latest
    steps:
      - name: Ensure the draft release exists
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No checkout here, so gh has no local .git to infer the repo from —
          # the same reason the publish job at the bottom sets it.
          GH_REPO: ${{ github.repository }}
          # **A `-suffix` tag is a prerelease, and GitHub has to be told.** Created without
          # the flag, `v0.32.0-rc.1` would publish as the latest release — the one
          # `gh release view`, the website and anyone reading "latest" would pick up.
          PRERELEASE: ${{ contains(github.ref_name, '-') }}
        run: |
          set -euo pipefail
          # Idempotent: a re-run of this workflow finds the draft it made the
          # first time, and `--generate-notes` is not asked for twice.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "draft already exists for $GITHUB_REF_NAME"
          else
            # **Which file is which, before the list of files.** A release carries fifteen
            # assets, and the app's bundles and the headless archives share every word but
            # one — a visitor could not tell which of them opens a window. Prepended to the
            # generated changelog, so it is the first thing on the page.
            #
            # Two versions: the bundler stamps the app with the tag's MAJOR.MINOR.PATCH (it
            # refuses a prerelease suffix), while the headless archives keep the tag whole.
            v="${GITHUB_REF_NAME#v}"; a="${v%%-*}"
            dl="https://github.com/${GH_REPO}/releases/download/${GITHUB_REF_NAME}"
            notes=$(cat <<NOTES
          ## Which file do I want?

          **The app**: the map, the window, and the \`sanity\` command.

          | Platform | Download |
          |---|---|
          | macOS (Apple silicon) | [Sanity_${a}_aarch64.dmg](${dl}/Sanity_${a}_aarch64.dmg), or \`brew install --cask monsterdept/tap/sanity\` |
          | Windows x64 | [Sanity_${a}_x64-setup.exe](${dl}/Sanity_${a}_x64-setup.exe) |
          | Windows ARM | [Sanity_${a}_arm64-setup.exe](${dl}/Sanity_${a}_arm64-setup.exe) |
          | Linux x64 | [.deb](${dl}/Sanity_${a}_amd64.deb) · [.rpm](${dl}/Sanity-${a}-1.x86_64.rpm) · [.AppImage](${dl}/Sanity_${a}_amd64.AppImage) |
          | Linux ARM | [.deb](${dl}/Sanity_${a}_arm64.deb) · [.rpm](${dl}/Sanity-${a}-1.aarch64.rpm) · [.AppImage](${dl}/Sanity_${a}_aarch64.AppImage) |

          **Headless**: every \`sanity\` command and no window, for CI runners and servers. In GitHub Actions, [\`monsterdept/sanity-action\`](https://github.com/monsterdept/sanity-action) fetches the right one for you.

          | Platform | Download |
          |---|---|
          | Linux x64 | [sanity-headless-${v}-x86_64-unknown-linux-gnu.tar.gz](${dl}/sanity-headless-${v}-x86_64-unknown-linux-gnu.tar.gz) |
          | Linux ARM | [sanity-headless-${v}-aarch64-unknown-linux-gnu.tar.gz](${dl}/sanity-headless-${v}-aarch64-unknown-linux-gnu.tar.gz) |
          | macOS (Apple silicon) | [sanity-headless-${v}-aarch64-apple-darwin.tar.gz](${dl}/sanity-headless-${v}-aarch64-apple-darwin.tar.gz) |
          | Windows x64 | [sanity-headless-${v}-x86_64-pc-windows-msvc.zip](${dl}/sanity-headless-${v}-x86_64-pc-windows-msvc.zip) |
          | Windows ARM | [sanity-headless-${v}-aarch64-pc-windows-msvc.zip](${dl}/sanity-headless-${v}-aarch64-pc-windows-msvc.zip) |

          NOTES
          )
            # The heredoc sits at this script's own indentation, which YAML strips: the
            # markdown reaches gh flush left (indented, it would render as code), and NOTES
            # closes it at column 0.
            gh release create "$GITHUB_REF_NAME" \
              --draft \
              --prerelease="$PRERELEASE" \
              --title "$GITHUB_REF_NAME" \
              --notes "$notes" \
              --generate-notes
          fi

  build:
    needs: draft
    strategy:
      fail-fast: false
      matrix:
        include:
          # GitHub-hosted, never self-hosted — see ci.yml. Every target builds
          # natively on its own architecture: no cross-compiling, so no second
          # toolchain, no LLVM on PATH for the C grammars, and each installer
          # carries its own architecture in its name.
          - os: macos-15
            platform: macos_arm64
          # 22.04, not latest: an AppImage runs on distros whose glibc is at
          # least the one it was built against, so the oldest supported image
          # reaches the most machines.
          - os: ubuntu-22.04
            platform: linux_x86-64
          - os: ubuntu-22.04-arm
            platform: linux_arm64
          # `target` is the triple, stated for the tauri CLI rather than for
          # cargo — see the Windows build step.
          - os: windows-latest
            platform: windows_x86-64
            msvc: x64
            target: x86_64-pc-windows-msvc
          - os: windows-11-arm
            platform: windows_arm64
            msvc: arm64
            target: aarch64-pc-windows-msvc

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      # Linux is the only platform that needs OS-level tauri deps as a
      # workflow step — Windows uses WebView2 (preinstalled), macOS uses
      # WebKit.framework (part of the OS). xdg-utils provides /usr/bin/xdg-mime,
      # which tauri-bundler shells out to during AppImage assembly; fakeroot is
      # needed by the deb bundler.
      - name: install tauri system deps (linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libxdo-dev \
            xdg-utils fakeroot

      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
        with:
          arch: ${{ matrix.msvc }}

      # Git for Windows ships a coreutils `link` in /usr/bin, and under `shell: bash` it sits
      # ahead of MSVC's link.exe on PATH — so rustc links with it and gets `extra operand`.
      # The runner is thrown away after the job, so removing it costs nothing.
      - name: Keep Git's link out of the linker's way (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: rm -f /usr/bin/link.exe

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v7
        with:
          node-version: 20

      # tauri-cli is invoked from src-tauri/ via `cargo tauri build`. A hosted
      # runner starts empty, so `cargo install` would compile it from source on
      # every release, on every platform; binstall fetches the prebuilt binary
      # where tauri publishes one and falls back to compiling where it does not.
      - uses: cargo-bins/cargo-binstall@main

      - name: Install tauri-cli
        shell: bash
        run: cargo binstall tauri-cli --version "^2" --locked --no-confirm

      - name: Install frontend dependencies
        shell: bash
        working-directory: web
        run: npm ci

      - name: Build frontend
        shell: bash
        working-directory: web
        run: npm run build

      # The tag is the version; scripts/stamp-version.mjs writes it into every file that carries
      # one, and fails closed if any of them missed. A -pre suffix is stripped because Tauri's
      # version field wants plain MAJOR.MINOR.PATCH; the tag and release name keep it.
      - name: Set version from tag
        shell: bash
        run: |
          BASE="${GITHUB_REF_NAME#v}"; BASE="${BASE%%-*}"
          node scripts/stamp-version.mjs "$BASE"

      - name: Import Apple signing certificate
        if: runner.os == 'macOS'
        shell: bash
        env:
          CERTIFICATE_BASE64: ${{ secrets.APPLE_DEVELOPER_CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPER_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 16)"

          echo "$CERTIFICATE_BASE64" | base64 -D > "$RUNNER_TEMP/certificate.p12"

          security delete-keychain "$KEYCHAIN_PATH" 2>/dev/null || true
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security import "$RUNNER_TEMP/certificate.p12" \
            -P "$CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security \
            -f pkcs12 \
            -k "$KEYCHAIN_PATH" || true

          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')

          echo "Available identities:"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep "Developer ID Application" | head -1 | sed 's/.*"\(.*\)"/\1/')
          if [ -z "$IDENTITY" ]; then
            echo "ERROR: No Developer ID Application certificate found"
            exit 1
          fi
          echo "APPLE_SIGNING_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

          rm -f "$RUNNER_TEMP/certificate.p12"

      # tauri build codesigns the .app when APPLE_SIGNING_IDENTITY is set in the
      # environment (exported above). Sanity has no sidecar binary to pre-sign —
      # scanning runs in-process, so the app bundle is the whole payload.
      - name: Build Tauri app (macOS, signed)
        if: runner.os == 'macOS'
        shell: bash
        working-directory: src-tauri
        run: cargo tauri build

      - name: Sign and notarize DMG (macOS)
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_ID: ${{ secrets.APPLE_DEVELOPER_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          DMG_FILE=$(find src-tauri/target/release/bundle/dmg -name "*.dmg" | head -1)
          if [ -z "$DMG_FILE" ]; then
            echo "ERROR: no DMG produced by tauri build"
            exit 1
          fi
          codesign --force --sign "$APPLE_SIGNING_IDENTITY" "$DMG_FILE"
          xcrun notarytool submit "$DMG_FILE" \
            --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID" \
            --wait
          xcrun stapler staple "$DMG_FILE"

      # **The last point a bad Mac build is caught, and it used to be a workstation's.**
      # `just publish` did both of these before distributing; nothing after this step looks
      # at the DMG again, so they run here, before the upload.
      #
      # The version is read out of the bundle rather than off the filename, which is chosen
      # by the same job whose stamping is in question: every release up to 0.8.1 stamped one
      # file of four, and a DMG named 0.8.1 held a binary introducing itself as 0.1.0.
      - name: Check the DMG (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          BASE="${GITHUB_REF_NAME#v}"; BASE="${BASE%%-*}"
          DMG_FILE=$(find src-tauri/target/release/bundle/dmg -name "*.dmg" | head -1)
          xcrun stapler validate "$DMG_FILE"
          mnt=$(mktemp -d)
          hdiutil attach "$DMG_FILE" -mountpoint "$mnt" -nobrowse -readonly -quiet
          app=$(find "$mnt" -maxdepth 1 -name '*.app' | head -1)
          got=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$app/Contents/Info.plist" 2>/dev/null || true)
          hdiutil detach "$mnt" -quiet || true
          if [ "$got" != "$BASE" ]; then
            echo "::error::$DMG_FILE contains version '$got', expected '$BASE'"
            exit 1
          fi
          echo "notarized, stapled, and the bundle reports $got"

      # tauri-bundler downloads linuxdeploy-plugin-gtk.sh into ~/.cache/tauri/
      # on first use. Current upstream re-creates GTK
      # immodule/printbackend symlinks with `ln -s` (no -f) over libraries the
      # linuxdeploy core call already staged, so the second `ln -s` dies with
      # "File exists" and bundling fails with the unhelpful "failed to run
      # linuxdeploy". Pre-download the plugin and patch `ln -s` → `ln -sf`
      # before the bundler looks for it.
      - name: Patch cached linuxdeploy-plugin-gtk (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$HOME/.cache/tauri"
          PLUGIN="$HOME/.cache/tauri/linuxdeploy-plugin-gtk.sh"
          if [ ! -f "$PLUGIN" ]; then
            curl -fSLo "$PLUGIN" \
              https://raw.githubusercontent.com/tauri-apps/linuxdeploy-plugin-gtk/master/linuxdeploy-plugin-gtk.sh
            chmod +x "$PLUGIN"
          fi
          sed -i 's|ln $verbose -s |ln $verbose -sf |g' "$PLUGIN"

      # AppImages self-mount via FUSE, and Ubuntu 24.04 dropped libfuse2, so the
      # AppImage runtime fails to launch. APPIMAGE_EXTRACT_AND_RUN=1 tells the
      # runtime to extract to a temp dir and run from there — no FUSE needed.
      - name: Build Tauri app (Linux)
        if: runner.os == 'Linux'
        shell: bash
        working-directory: src-tauri
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: cargo tauri build

      # **The target is named, because the tauri CLI otherwise assumes its own.** There is
      # no arm64 Windows build of tauri-cli to install, so binstall fetches the x86_64 one
      # and it runs emulated on windows-11-arm. Cargo still built an arm64 `sanity.exe`,
      # but the CLI named and configured the installer for the architecture IT was
      # running on: v0.33.0's arm64 job uploaded `Sanity_0.33.0_x64-setup.exe`, the x64
      # job overwrote it six minutes later, and the release shipped with no arm64
      # installer. Had the jobs finished in the other order, x64 users would have been
      # served the arm64 app.
      - name: Build Tauri app (Windows)
        if: runner.os == 'Windows'
        shell: bash
        working-directory: src-tauri
        run: cargo tauri build --bundles nsis --target ${{ matrix.target }}

      - name: Collect Tauri artifacts (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p artifacts
          BUNDLE="src-tauri/target/release/bundle"
          for f in "$BUNDLE"/dmg/*.dmg; do
            [ -f "$f" ] && cp "$f" artifacts/
          done

      - name: Collect Tauri artifacts (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p artifacts
          BUNDLE="src-tauri/target/release/bundle"
          for dir in deb appimage rpm; do
            for f in "$BUNDLE/$dir"/*; do
              [ -f "$f" ] || continue
              cp "$f" artifacts/
            done
          done

      # Each installer is `_x64-setup.exe` or `_arm64-setup.exe`, the names the website
      # links to. The cross build used to suffix its own, which made the arm64 asset
      # `_arm64-setup_arm64.exe` and nothing linked to it.
      - name: Collect Tauri artifacts (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          # Both Windows jobs upload into one release with `--clobber`, so an installer
          # named for the wrong architecture does not fail — it replaces the other job's.
          # Refuse anything not named for this job's own.
          shopt -s nullglob
          found=(src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*_${{ matrix.msvc }}-setup.exe)
          if [ ${#found[@]} -ne 1 ]; then
            echo "::error::expected one *_${{ matrix.msvc }}-setup.exe, found:"
            ls src-tauri/target/${{ matrix.target }}/release/bundle/nsis/ || true
            exit 1
          fi
          cp "${found[0]}" artifacts/

      # All platforms push their bundles directly to the draft GH release via
      # softprops/action-gh-release rather than actions/upload-artifact: release
      # assets don't count against the Actions artifact-storage quota, and this
      # avoids the chunked-Azure-Blob upload path that historically stalled on
      # Mac runners with tens-of-MB Tauri payloads. The `release` job publishes.
      - name: List artifacts (pre-upload)
        shell: bash
        run: ls -lh artifacts/

      # **Uploaded with retries, because the failure is GitHub's and transient.**
      # `Error creating asset temp dir` and `Error saving asset` are the release
      # service's own messages, not the action's — the action rethrows them and
      # the job dies with a built, signed bundle sitting on the runner. Both
      # Windows builds of v0.30.1 died that way, one on each message, seconds
      # apart. An upload that can fail on the far side needs to be asked twice.
      #
      # `--clobber` so a retry after a half-made asset replaces it rather than
      # colliding with itself. The draft is guaranteed by the `draft` job, so
      # nothing here creates a release — this step only ever adds to one.
      - name: Push artifacts to draft release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Said plainly, because the alternative is `gh: command not found` at
          # the end of a twenty-minute signed build. GitHub's hosted images
          # ship the CLI, which is the assumption this step rests on.
          command -v gh >/dev/null || { echo "::error::gh is not on PATH for ${{ matrix.platform }}"; exit 1; }
          # What `fail_on_unmatched_files` was for: a platform that bundled
          # nothing must fail here rather than let the release publish without it.
          shopt -s nullglob
          files=(artifacts/*)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::no artifacts to upload"
            exit 1
          fi
          for attempt in 1 2 3 4 5; do
            if gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber; then
              echo "uploaded ${#files[@]} file(s) on attempt $attempt"
              exit 0
            fi
            echo "upload attempt $attempt failed; retrying in $((attempt * 15))s"
            sleep $((attempt * 15))
          done
          echo "::error::release asset upload failed after 5 attempts"
          exit 1

  # Every CLI verb with no window, for CI runners and servers — see
  # docs/plans/done/headless-cli.md. Its own workflow so a pull request can build the same
  # archives without a release.
  headless:
    needs: draft
    uses: ./.github/workflows/headless.yml
    with:
      tag: ${{ github.ref_name }}

  release:
    needs: [build, headless]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # This job has no checkout step, so gh has no local .git to infer the
          # repo from. GH_REPO points the gh release calls at the repo directly.
          GH_REPO: ${{ github.repository }}
          PRERELEASE: ${{ contains(github.ref_name, '-') }}
        run: |
          # The build jobs push their bundles directly to the draft release, so
          # nothing to download here. Ensure the release exists and publish it.
          # Also covers re-runs, where the release already exists.
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" \
              --draft \
              --prerelease="$PRERELEASE" \
              --title "$GITHUB_REF_NAME" \
              --generate-notes
          fi
          # **SHA256SUMS, so an installer can refuse a file that is not what CI built.**
          # install.sh and sanity-action check every download against it before unpacking or
          # running anything. Taken from the files as the release serves them, and checked
          # against the digest GitHub computed on upload, so a file damaged between runner and
          # release cannot be vouched for here.
          rm -rf sums && mkdir sums
          gh release download "$GITHUB_REF_NAME" --dir sums
          rm -f sums/SHA256SUMS
          (cd sums && sha256sum -- * | sort -k2) > SHA256SUMS
          gh release view "$GITHUB_REF_NAME" --json assets \
            --jq '.assets[] | select(.name != "SHA256SUMS") | "\(.digest // "none" | sub("^sha256:"; ""))  \(.name)"' \
            | sort -k2 > github.sums
          if ! diff SHA256SUMS github.sums; then
            echo "::error::a release file does not match the digest GitHub recorded for it"
            exit 1
          fi
          gh release upload "$GITHUB_REF_NAME" SHA256SUMS --clobber
          cat SHA256SUMS
          gh release edit "$GITHUB_REF_NAME" --draft=false

  # **The Homebrew cask, generated from the DMG this release just published.** It was the last
  # thing `just publish` did from a workstation; the rest of that recipe is gone (dl.dept.monster
  # is frozen at 0.33.0, and the site is Pages).
  #
  # TAP_DEPLOY_KEY is the private half of a deploy key on monsterdept/homebrew-tap: write
  # access to that one repo and nothing else, owned by the repo rather than a person, and it
  # does not expire the way a token does. The cask points at GitHub Releases, which serve
  # nothing while this repo is private, so the job waits for public like Pages does.
  cask:
    needs: release
    if: ${{ !contains(github.ref_name, '-') && !github.event.repository.private }}
    runs-on: ubuntu-latest
    steps:
      - name: Update the cask
        shell: bash
        env:
          TAP_DEPLOY_KEY: ${{ secrets.TAP_DEPLOY_KEY }}
          TAP_REPO: monsterdept/homebrew-tap
        run: |
          set -euo pipefail
          [ -n "$TAP_DEPLOY_KEY" ] || { echo "::error::TAP_DEPLOY_KEY is not set — see the comment on this job"; exit 1; }
          # The key, and github.com's host keys as GitHub publishes them over HTTPS, so the
          # first connection is not a trust-on-first-use guess.
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$TAP_DEPLOY_KEY" > ~/.ssh/tap && chmod 600 ~/.ssh/tap
          curl -fsSL https://api.github.com/meta | jq -r '.ssh_keys[] | "github.com " + .' > ~/.ssh/known_hosts
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/tap -o IdentitiesOnly=yes"
          VERSION="${GITHUB_REF_NAME#v}"
          DMG="Sanity_${VERSION}_aarch64.dmg"
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/${DMG}"

          # The sha256 has to describe the bytes brew will fetch, so it is taken from what the
          # URL serves. A cask whose checksum does not match fails on every user's machine and
          # nowhere else.
          code=$(curl -sL -o dmg -w '%{http_code}' "$URL")
          [ "$code" = "200" ] || { echo "::error::$URL returned HTTP $code"; exit 1; }
          sha=$(sha256sum dmg | awk '{print $1}')

          git clone --depth 1 "git@github.com:${TAP_REPO}.git" tap
          mkdir -p tap/Casks
          {
          echo "# Generated by sanity's release workflow. DO NOT EDIT."
          echo 'cask "sanity" do'
          echo "  version \"${VERSION}\""
          echo "  sha256 \"${sha}\""
          echo ''
          echo "  url \"https://github.com/${GITHUB_REPOSITORY}/releases/download/v#{version}/Sanity_#{version}_aarch64.dmg\""
          echo '  name "Sanity"'
          echo '  desc "See where the thinking in your codebase actually is"'
          echo '  homepage "https://sanity.monster"'
          echo ''
          echo '  # arm64 only — CI builds a single aarch64-apple-darwin bundle.'
          echo '  depends_on arch: :arm64'
          echo '  # Big Sur is the floor by arithmetic, not by choice: tauri.conf.json sets no'
          echo '  # minimumSystemVersion, and no earlier macOS ran on Apple Silicon.'
          echo '  depends_on macos: :big_sur'
          echo ''
          echo '  app "Sanity.app"'
          # The CLI is the same binary, symlinked by brew into its own bin, which is on PATH.
          # Pointed at the binary inside the bundle rather than a copy, so the two cannot drift.
          echo '  binary "#{appdir}/Sanity.app/Contents/MacOS/sanity"'
          echo ''
          echo '  zap trash: ['
          echo '    "~/Library/Application Support/Sanity",'
          echo '    "~/Library/WebKit/sanity",'
          echo '    "~/Library/Preferences/monster.sanity.plist",'
          echo '    "~/Library/Saved Application State/monster.sanity.savedState",'
          echo '  ]'
          echo 'end'
          } > tap/Casks/sanity.rb
          ruby -c tap/Casks/sanity.rb >/dev/null

          cd tap
          git add Casks/sanity.rb
          # **A regenerated cask may only ADD.** 0.11.0 shipped without `binary` because an older
          # generator overwrote a newer cask, and nothing downstream could see a line that
          # stopped being there. A re-run of an old tag is the same hazard here. version, sha256
          # and url are the lines that are supposed to change — url once, when downloads moved
          # from dl.dept.monster to GitHub Releases.
          lost=$(git diff --staged -U0 -- Casks/sanity.rb \
              | grep '^-' | grep -v '^---' \
              | grep -vE '^-  (version|sha256|url) ' \
              | grep -v "^-# Generated by" || true)
          if [ -n "$lost" ]; then
            echo "::error::regenerating the cask would REMOVE lines:"
            echo "$lost"
            exit 1
          fi
          if git diff --staged --quiet; then
            echo "cask already current"
            exit 0
          fi
          git -c user.name="sanity release" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "sanity ${VERSION}"
          git push -q
          # Read back at the exact commit pushed: raw.githubusercontent.com/<repo>/main is a CDN
          # that can lag the branch by an hour; a commit SHA is never stale.
          pushed=$(git rev-parse HEAD)
          remote=$(git ls-remote origin "refs/heads/$(git rev-parse --abbrev-ref HEAD)" | awk '{print $1}')
          [ "$remote" = "$pushed" ] || { echo "::error::tap is at ${remote:-none}, expected $pushed"; exit 1; }
          served=$(curl -sL "https://raw.githubusercontent.com/${TAP_REPO}/${pushed}/Casks/sanity.rb" | awk -F'"' '/^  version/{print $2}')
          [ "$served" = "$VERSION" ] || { echo "::error::tap serves '${served:-none}', expected $VERSION"; exit 1; }
          echo "tap serves $served"

  # The website follows the release, so its download links point at files that now exist.
  # A prerelease is not offered to visitors, so it does not move the site.
  pages:
    needs: release
    if: ${{ !contains(github.ref_name, '-') }}
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
