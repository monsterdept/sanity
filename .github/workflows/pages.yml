name: Pages

# The website, served by GitHub Pages at sanity.monster.
#
# Deployed when website/ changes on main, and by release.yml once a release is published, so the
# download links move to the new version the moment its files exist. Every `__VERSION__` in the
# page is pinned to the latest published release: a versioned URL can be cached forever, where a
# mutable "latest" can serve a stale file after a release.
#
# **Called by release.yml rather than triggered by the release.** release.yml publishes with
# GITHUB_TOKEN, and GitHub starts no workflow from an event that token caused, so a `release:
# published` trigger here would never fire.
on:
  push:
    branches:
      - main
    paths:
      - "website/**"
      - ".github/workflows/pages.yml"
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time, and never cancel one halfway: a release and a website edit landing
# together should both go out, in order.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    # Pages is free on public repos only. While this one is private there is nothing to deploy
    # to, and a failing run would say the site is broken when it simply does not exist yet.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - name: Pin the page to the latest release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # `gh release view` with no tag is the latest release that is neither a draft nor a
          # prerelease — the one a visitor should be offered.
          tag=$(gh release view --json tagName --jq .tagName)
          version="${tag#v}"
          mkdir -p _site
          cp -R website/. _site/
          sed -i "s/__VERSION__/${version}/g" _site/index.html
          if grep -q "__VERSION__" _site/index.html; then
            echo "::error::unsubstituted __VERSION__ remains in index.html"
            exit 1
          fi
          echo "pinned to $version"

      # **install-headless.sh is install.sh with two defaults changed, and never a second
      # script.** It is the CI line: the build without a window, into the current directory,
      # so a job runs `./sanity` without touching PATH. Generated here so every fix to
      # install.sh, the checksum check included, reaches it; the check below fails the deploy
      # if install.sh's default lines ever stop matching, rather than serving an unchanged copy
      # under a name that promises otherwise.
      - name: Write install-headless.sh
        shell: bash
        run: |
          set -euo pipefail
          sed -e 's/^headless=0$/headless=1/' \
              -e 's|^dir="${SANITY_INSTALL_DIR:-$HOME/.local/bin}"$|dir="${SANITY_INSTALL_DIR:-.}"|' \
              -e '1a\
          # Generated from install.sh when the site is deployed: --headless, into the current directory.' \
              _site/install.sh > _site/install-headless.sh
          grep -qx 'headless=1' _site/install-headless.sh || { echo "::error::install-headless.sh did not get headless=1"; exit 1; }
          grep -qx 'dir="${SANITY_INSTALL_DIR:-.}"' _site/install-headless.sh || { echo "::error::install-headless.sh did not get the current directory"; exit 1; }
          chmod +x _site/install-headless.sh

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v5
