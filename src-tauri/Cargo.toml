[package]
name = "sanity"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Sanity — see where the thinking in your codebase actually is"
publish = false
default-run = "sanity"

[lib]
name = "sanity_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [], optional = true }

[dependencies]
# The window, and everything only the window needs. Optional so `--no-default-features`
# builds every CLI verb with no Tauri, WebKit or GTK — see `gui` below.
tauri = { version = "2", features = ["macos-private-api"], optional = true }
tauri-plugin-single-instance = { version = "2", optional = true }
tauri-plugin-opener = { version = "2", optional = true }
tauri-plugin-dialog = { version = "2", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The one thing that crosses the IPC as bytes: an exported replay, on its way to a file
# the save dialog picked. Already in the tree several times over — reqwest and tauri both
# pull it — so this is a name for a crate that is being compiled anyway.
base64 = { version = "0.22", optional = true }
anyhow = "1"
# Repo walking that honours .gitignore/.ignore for free — the same matcher ripgrep
# uses. Getting this wrong means node_modules dominates every sunburst.
ignore = "0.4"
# The scan is embarrassingly parallel per file; rayon is the whole concurrency story.
rayon = "1"
# The compressibility term in the heuristic scorer: boilerplate compresses, novel
# logic doesn't. deflate is the right shape (small windows, cheap) — we want a
# ratio, not archival compression.
flate2 = "1"
# The surprise model's HTTP to a local Ollama. Optional at runtime (the heuristic
# scorer needs no model at all); reqwest is always compiled because the setting is
# a runtime toggle, not a build-time one. Blocking, because scoring runs on rayon
# threads — never inside the Tauri/tokio runtime (commands hand the whole scan to
# spawn_blocking), which is the one context where a blocking client panics.
reqwest = { version = "0.12", default-features = false, features = ["json", "blocking", "rustls-tls"] }
# Grammars are pinned to exact minors: each tree-sitter-* release is built against a
# specific core ABI, and a semver-compatible bump of one grammar alone has broken the
# `LANGUAGE.into()` conversion before. Bump them together, deliberately.
tree-sitter = "0.26.11"
tree-sitter-rust = "0.24.2"
tree-sitter-typescript = "0.23.2"
tree-sitter-javascript = "0.25.0"
tree-sitter-python = "0.25.0"
tree-sitter-go = "0.25.0"
dirs = "6.0.0"
axum = "0.8.9"
# `process` and `time`: `sanity check` spawns readers and waves them. See `harness.rs`.
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "process", "time", "signal"] }
tree-sitter-swift = "0.7.3"
tree-sitter-c = "0.24.2"
tree-sitter-cpp = "0.23.4"
tree-sitter-bash = "0.25.1"
tree-sitter-sequel = "0.3.11"
tree-sitter-java = "0.23.5"
tree-sitter-kotlin-ng = "1.1.0"
tree-sitter-c-sharp = "0.23.5"
tree-sitter-ruby = "0.23.1"
tree-sitter-php = "0.24.2"
tree-sitter-lua = "0.5.0"
tree-sitter-elixir = "0.3.5"
tree-sitter-scala = "0.26.0"
tree-sitter-dart = "0.2.0"
tree-sitter-zig = "1.1.2"
tree-sitter-objc = "3.0.2"
tree-sitter-gdscript = "6.1.0"
tree-sitter-haskell = "0.23.1"
tree-sitter-nix = "0.3.0"
tree-sitter-powershell = "0.26.4"
tree-sitter-solidity = "1.2.13"
tree-sitter-r = "1.3.0"
tree-sitter-ocaml = "0.25.0"
tree-sitter-cmake = "0.7.4"
tree-sitter-julia = "0.23.1"
tree-sitter-erlang = "0.20.0"
tree-sitter-pascal = "0.10.2"
# The `tree-sitter-clojure` crate pins tree-sitter ^0.25 as a normal dependency, and
# tree-sitter carries a `links = "tree-sitter"` key — so two versions cannot coexist in
# one binary at any price. `-orchard` is the same grammar without the pin.
tree-sitter-clojure-orchard = "0.2.8"
tree-sitter-fsharp = "0.3.11"
tree-sitter-groovy = "0.1.2"
tree-sitter-elm = "5.9.4"
tree-sitter-fortran = "0.6.0"
tree-sitter-starlark = "1.3.0"
tree-sitter-verilog = "1.0.3"
tree-sitter-gleam = "1.0.0"
tree-sitter-odin = "1.3.0"
tree-sitter-perl = "1.1.2"
tree-sitter-vb-dotnet = "0.1.0"
tree-sitter-elisp = "1.7.2"
tree-sitter-qmljs = "0.3.1"
tree-sitter-scheme = "0.24.7"
tree-sitter-cfml = "0.26.31"
tree-sitter-glsl = "0.2.0"
tree-sitter-racket = "0.24.7"
tree-sitter-commonlisp = "0.4.1"
tree-sitter-ada = "0.1.0"
tree-sitter-d = "0.8.2"
tree-sitter-systemverilog = "0.4.0"
tree-sitter-vhdl = "1.4.0"
tree-sitter-zsh = "0.63.4"
tree-sitter-hlsl = "0.2.0"
tree-sitter-luau = "1.2.0"
tree-sitter-slang = "0.3.1"
tree-sitter-ocamllex = "0.25.0"
tree-sitter-prolog = "0.1.0"
tree-sitter-gdshader = "0.4.0"
tree-sitter-jq = "1.0.2"
clap = { version = "4.6.6", features = ["derive", "wrap_help"] }
libc = "0.2.189"
terminal_size = "0.4.4"
bincode = { version = "2", features = ["serde"] }

[dev-dependencies]
tempfile = "3"

[features]
default = ["gui"]
# The window. On by default, so `cargo build`, `just dev` and the release bundles are the app.
# `--no-default-features` is the headless build: the same `sanity`, every verb, no window —
# for CI runners and servers where the app is not installed. See
# `docs/plans/done/headless-cli.md`.
gui = [
    "dep:tauri",
    "dep:tauri-plugin-single-instance",
    "dep:tauri-plugin-opener",
    "dep:tauri-plugin-dialog",
    "dep:tauri-build",
    "dep:base64",
]
custom-protocol = ["gui", "tauri/custom-protocol"]

[[bin]]
name = "sanity"
path = "src/main.rs"

# Standalone workspace so cargo never folds this into a parent build graph.
#
# `tools` holds the dev tools — `sanity-findings`, `sanity-history`, `sanity-tokens`. They are a
# crate of their own because the Tauri bundler ships every binary THIS package builds, and each
# of them weighs about as much as the app: in the app crate they were most of every download.
# A member rather than a crate apart, so they share this lockfile and this target directory.
[workspace]
members = ["tools"]
