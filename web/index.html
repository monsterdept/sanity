<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sanity</title>

    <!--
      The ground, decided before anything is painted.

      This used to be `class="dark"` on the element above — a guess, and the wrong guess
      for everyone in light mode, who got a dark window for as long as the bundle took to
      load. The preference is in localStorage and localStorage is synchronous, so there is
      no reason to guess: this runs blocking, in the head, before the body exists.

      It duplicates `applyTheme` in `lib/theme.ts` — deliberately, and the two have to move
      together. The module version cannot be reused here because reusing it means loading
      the bundle, and the whole point is to have an answer before the bundle exists. The
      key string is the duplication that matters; `sanity.theme` is stated in both places.
    -->
    <script>
      ;(function () {
        var dark = true
        try {
          var stored = localStorage.getItem('sanity.theme')
          dark =
            stored === 'dark' ||
            ((stored === 'system' || stored === null) &&
              window.matchMedia('(prefers-color-scheme: dark)').matches)
        } catch (e) {
          /* storage unavailable — fall back to the system, which is also the default */
          dark = window.matchMedia('(prefers-color-scheme: dark)').matches
        }
        document.documentElement.classList.toggle('dark', dark)
      })()
    </script>

    <!--
      The splash, inline for the same reason the script above is.

      In development Vite injects the stylesheet through JS, so until the bundle runs the
      document has no styles at all and the webview paints its default WHITE — a full
      window of it, in both themes, for as long as the app takes to boot. A stylesheet
      link would not fix it, because the file it points at is the thing being waited for.
      Only rules that arrive with the document can paint the first frame.

      So these two colours are a third copy of the ground (`index.css`, `lib/theme.ts`,
      here) and must move with the others. They are the only two: everything else on this
      screen is the wordmark, which takes `currentColor`.
    -->
    <style>
      :root {
        --splash-bg: #f5f1ea; /* Paper */
        --splash-fg: #1a1a1a; /* Ink */
      }
      .dark {
        --splash-bg: #1a1a1a; /* Ink */
        --splash-fg: #f5f1ea; /* Paper */
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--splash-bg);
      }
      #splash {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--splash-bg);
        color: var(--splash-fg);
        /* Faded in rather than snapped on. At the speed the app usually boots the mark
           should be arriving as the window opens, not stamped onto it — and on a cold
           start, where the wait is real, an arrival reads as loading where a static mark
           reads as finished. */
        animation: splash-in 420ms ease-out both;
        transition: opacity 260ms ease-out;
      }
      #splash.is-gone {
        opacity: 0;
        pointer-events: none;
      }
      #splash svg {
        /* Giant, and bounded on BOTH axes. Width alone is not enough: the mark is nearly
           three times as wide as it is tall, so a wide-and-short window sized by width
           alone gives it more height than the window has. `max-height` lets the aspect
           ratio pull the width back down instead. */
        width: min(60vw, 640px);
        max-height: 34vh;
        opacity: 0.92;
      }
      @keyframes splash-in {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }
      /* Nothing to animate for someone who has asked for no animation. The mark is the
         message; the fade is decoration. */
      @media (prefers-reduced-motion: reduce) {
        #splash {
          animation: none;
          transition: none;
        }
      }
    </style>
  </head>

      The same rule `MINIFIED_LINE_BYTES` follows in `history.rs`: a copy that exists
      because the original cannot be reached from here. The component is a React module,
      and importing a module is exactly the wait this screen exists to cover. Brand rule
      applies to both copies — ink or white by `currentColor`, no recolouring, no effects,
      no rotation.

      A drag region, because a window you cannot move while it loads is a window that
      looks hung.
    -->
